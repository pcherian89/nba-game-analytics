name: Update NBA Data from Kaggle

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: "0 13 * * *"  # Runs every day at 8 AM EST (13:00 UTC)

permissions:
  contents: write  # ✅ Allow the bot to push updates

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📄 Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # ✅ Uses built-in token for push access

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas

      - name: 🔐 Set Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: 🛠 Run Kaggle Download Script
        run: python download_kaggle_data.py

      - name: 📤 Commit & Push updated files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "📊 Auto-update NBA data from Kaggle" || echo "No changes to commit"
          git push


