name: Update NBA Data from Kaggle

on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI
  schedule:
    - cron: '0 3 * * *'  # Runs daily at 3 AM UTC (adjust if needed)

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          pip install kaggle

      - name: 🔐 Set Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: 📥 Run Kaggle Download Script
        run: python download_kaggle_data.py

      - name: 🗃️ Commit & Push updated files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add nba_data/
          git commit -m "♻️ Auto-update NBA data from Kaggle"
          git push
        continue-on-error: true

